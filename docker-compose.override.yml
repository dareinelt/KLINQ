# Entwicklungs-Override: Quellcode live einbinden, MySQL-Port freigeben.
services:
  app:
    volumes:
      - ./:/var/www/html
      - assets_uploads:/var/www/html/storage/uploads
      - assets_logs:/var/www/html/storage/logs
      - assets_labels:/var/www/html/storage/labels
  mysql:
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
