services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: assets-app
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - assets_uploads:/var/www/html/storage/uploads
      - assets_logs:/var/www/html/storage/logs
      - assets_labels:/var/www/html/storage/labels
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: assets-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - assets_db:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  assets_db:
  assets_uploads:
  assets_logs:
  assets_labels:
