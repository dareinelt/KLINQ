<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        FallbackResource /index.php
    </Directory>

    # Service Worker und Manifest
    AddType application/manifest+json .webmanifest
    AddType text/javascript .js .mjs

    # Statische Assets: immer revalidieren (Cache-Busting via ?v=mtime), @import-Kinder eingeschlossen
    <FilesMatch "\.(css|js|mjs|svg|png|webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # Storage darf niemals direkt ausgeliefert werden
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
